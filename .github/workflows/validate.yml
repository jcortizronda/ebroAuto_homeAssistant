name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validación HACS
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validación hassfest
        uses: home-assistant/actions/hassfest@master

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Instalar ruff
        run: pip install ruff
      - name: Lint
        run: ruff check custom_components tests
      - name: Formato
        # `--diff` en vez de reescribir: en CI el trabajo es AVISAR, no cambiar el codigo a
        # espaldas de quien abrio el PR.
        run: ruff format --diff custom_components tests || true

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          # La versión la fija pytest-homeassistant-custom-component (requires-python >=3.14),
          # que a su vez sigue a la de Home Assistant.
          python-version: "3.14"
          cache: pip
      - name: Instalar dependencias de test
        run: pip install -r requirements_test.txt
      - name: Ejecutar la suite
        # SIN --snapshot-update a propósito: los .ambr están versionados y un cambio no
        # revisado en las entidades debe hacer fallar el job, no reescribirse solo.
        run: pytest tests/ --cov=custom_components/ebro --cov-report=term-missing
